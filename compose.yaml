services:
  ai-secretary:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - secretary-data:/app/data
    expose:
      - '8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  secretary-data:
